services:
  eve:
    build: .
    image: ghcr.io/iamangus/eve:latest
    ports:
      - "8090:8090"
    environment:
      LISTEN: ":8090"
      AGENTFOUNDRY_URL: ${AGENTFOUNDRY_URL:-http://host.docker.internal:3000}
      AGENTFOUNDRY_API_KEY: ${AGENTFOUNDRY_API_KEY:?AGENTFOUNDRY_API_KEY is required}
      ASSISTANT_AGENT_ID: ${ASSISTANT_AGENT_ID:?ASSISTANT_AGENT_ID is required}
      ROUTER_AGENT_ID: ${ROUTER_AGENT_ID:-}
      EVEMCP_URL: ${EVEMCP_URL:-http://eve:8090/mcp}
      PROACTIVE_ENABLED: ${PROACTIVE_ENABLED:-true}
      WEB_PRESENCE_TIMEOUT: ${WEB_PRESENCE_TIMEOUT:-60s}
      DATA_DIR: ${DATA_DIR:-/data}
      EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL:-60s}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      MATRIX_USER_ID: ${MATRIX_USER_ID:-}
      MATRIX_PICKLE_KEY: ${MATRIX_PICKLE_KEY:-}
      CALDAV_URL: ${CALDAV_URL:-}
      CALDAV_USERNAME: ${CALDAV_USERNAME:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      CALDAV_CALENDAR_PATH: ${CALDAV_CALENDAR_PATH:-}
      CAL_REMINDER_LEAD: ${CAL_REMINDER_LEAD:-15m}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      VOICE_WEBHOOK_TOKEN: ${VOICE_WEBHOOK_TOKEN:-}
      HISTORIAN_AGENT_ID: ${HISTORIAN_AGENT_ID:-}
      CONTEXT_BUDGET_TOKENS: ${CONTEXT_BUDGET_TOKENS:-64000}
      CONTEXT_TRIGGER_FRACTION: ${CONTEXT_TRIGGER_FRACTION:-0.5}
      CONTEXT_PROTECTED_TAIL_TOKENS: ${CONTEXT_PROTECTED_TAIL_TOKENS:-12000}
      CONTEXT_CHUNK_TOKENS: ${CONTEXT_CHUNK_TOKENS:-20000}
      CONTEXT_MEMORY_LIMIT: ${CONTEXT_MEMORY_LIMIT:-200}
      CONTEXT_CURATE_INTERVAL: ${CONTEXT_CURATE_INTERVAL:-24h}
    volumes:
      - eve-data:/data
    restart: unless-stopped

volumes:
  eve-data: