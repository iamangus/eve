root = "."
tmp_dir = "/tmp/opencode/eve-air"

[build]
cmd = "go build -tags goolm -o /tmp/opencode/eve-air/main ./cmd/server/"
bin = "/tmp/opencode/eve-air/main"
include_ext = ["go"]
exclude_dir = ["frontend", "data", "tmp", "vendor"]
delay = 500
kill_delay = 500
log = "/tmp/opencode/eve-air-errors.log"
